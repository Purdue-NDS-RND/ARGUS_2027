name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Default persist-credentials on purpose: Micro-XRCE-DDS-Gen is a gitlink
      # with no .gitmodules entry, and checkout's in-step credential cleanup
      # (persist-credentials: false) dies on it. The token is read-only here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install test tools
        run: python -m pip install pytest numpy opencv-python-headless pyyaml

      - name: Run scripts/check.sh
        env:
          CHECK_STRICT: "1"
        run: bash scripts/check.sh
