# Values platform/jetson/setup.sh works from. Sourced by bash.
# Anything marked "bench" has not been seen on the real Orin yet: the first
# run of the script there confirms it or corrects it here.

# JetPack 6.2 is Jetson Linux 36.4.3 (6.2.1 is 36.4.4). 36.4.0 is JetPack 6.1,
# which has no MAXN SUPER mode, so the revision must be 4.3 or a later 4.x.
L4T_RELEASE=R36
L4T_REVISION_MAJOR=4
L4T_REVISION_MIN_MINOR=3
BOARD_MODEL="Orin Nano"

# The 25 W "Super" mode, by the name /etc/nvpmodel.conf gives it. The script
# reads the mode's number from that file.
POWER_MODE=MAXN_SUPER

# The "fan curve": nvfancontrol ships two, quiet and cool. cool starts the fan
# earlier and reaches full speed at a lower temperature.
FAN_PROFILE=cool

# Logs (frames, bags, attempt bundles) go on the NVMe.
LOG_LABEL=argus-logs
LOG_MOUNT=/mnt/argus-logs

# ROS 2 Humble on Ubuntu 22.04 (what JetPack 6 is built on).
ROS_DISTRO_NAME=humble
UBUNTU_CODENAME=jammy
ROS_APT_URL=http://packages.ros.org/ros2/ubuntu
ROS_KEY_URL=https://raw.githubusercontent.com/ros/rosdistro/master/ros.key
# What the packages under src/ depend on, MAVROS, the build tool, and chrony
# for the shared clock (PLT-02).
ROS_PACKAGES=(
    ros-humble-ros-base
    ros-humble-mavros
    ros-humble-mavros-extras
    ros-humble-mavros-msgs
    ros-humble-cv-bridge
    ros-humble-vision-msgs
    ros-humble-message-filters
    ros-humble-tf2-ros
    ros-humble-tf2-msgs
    ros-humble-rosbag2-storage-mcap
    ros-humble-rosidl-default-generators
    python3-colcon-common-extensions
    python3-pip
    python3-numpy
    python3-yaml
    python3-opencv
    geographiclib-tools
    chrony
)

# ONNX Runtime with the CUDA and TensorRT providers. PyPI's wheel for arm64 is
# CPU only; the Jetson builds come from NVIDIA's Jetson AI Lab index. (bench:
# the index address and the version it serves for JetPack 6.2)
ORT_INDEX_URL=https://pypi.jetson-ai-lab.io/jp6/cu126
ORT_PACKAGE=onnxruntime-gpu

# USB vendor ids a Pixhawk running ArduPilot can show: the ArduPilot project's
# own (1209), Holybro's (3162, 3185: the aircraft has a Pixhawk 6C), and the
# older 3D Robotics one (26ac). (bench: `udevadm info -a /dev/ttyACM0` on the
# aircraft; set ARGUS_PIXHAWK_SERIAL to pin the rule to that one board)
PIXHAWK_USB_VENDORS=(1209 3162 3185 26ac)
