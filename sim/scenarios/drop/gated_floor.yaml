# The gated drop's floor (CEN-04).
# This scenario's config hands the descent over to FINAL_ALIGN at 2.25 m on
# the flight controller's height, which in the sim reads 0.19 m high; with
# the descent's 0.15 m of overshoot the vehicle comes to about 1.9 m above
# the ground: under our 2.0 m floor, above the rules' 1.83 m.
# What must be seen: FINAL_ALIGN climbs straight back before anything else,
# goes on up into the release band, and releases there when the gates hold;
# nothing is released under 2.0 m. The target is the 1.5 m one the ring fit
# holds at 2 m.
description: Gated drop handed over under the 2.0 m floor; climbs back into the band before releasing.
mission: drop
site: apollo_xi
seed: 1
timeout_s: 600
sequence: package_drop_demo.yaml
params: sim_target_mission.yaml
sim_time: true
flags:
  use_frame_time_pose: true
  use_target_estimator: true
  use_height_estimator: true
  centre_on_estimator: true
  centring_retune: true
  use_ring_fit: true
  drop_release_gates: true
node_flags:
  target_cv:
    stamp_from_image: true
    detection_contract: true
  ring_fit:
    ring_fit: true
config:
  package_drop:
    drop_column_handoff_altitude_m: 2.25
targets:
  package_drop: drop_target
objects:
  - name: drop_target
    kind: bullseye
    size_m: 1.5
    rings: 4
    at: {east_m: 10.0, north_m: 15.0}
wind: {level: calm}
