# The actuation lock on the drop servo, in a flight (PLT-09): drop/gated with the flags actuation_lock and
# takeover_latch on. The drop's release state asks the lock (DROP_PAYLOAD, with the release height's own word)
# and its one command must go out: the package is dropped as in drop/gated, the log has no refusal, and a
# healthy flight is never latched out. Flown with --variants on. Not in the nightly suite.
description: The gated drop of a real 0.5 kg package with the actuation lock and the takeover latch on - the release must go out once, and a healthy flight must not be latched out.
mission: drop
site: apollo_xi
seed: 1
timeout_s: 600
sequence: package_drop_demo.yaml
params: sim_target_mission.yaml
sim_time: true
flags:
  use_frame_time_pose: true
  use_target_estimator: true
  use_height_estimator: true
  centre_on_estimator: true
  centring_retune: true
  use_ring_fit: true
  drop_release_gates: true
  actuation_lock: true
  takeover_latch: true
node_flags:
  simple_takeoff_service:
    takeoff_cancel: true      # the latch flies nothing without the take-off node's cancel
  target_cv:
    stamp_from_image: true
    detection_contract: true
  ring_fit:
    ring_fit: true
config:
  package_drop:
    fake_drop: false
    airframe: sim_iris_parcel   # the parcel hangs 0.13 m left of the vehicle's centre: it, not the vehicle, is put over the target
targets:
  package_drop: drop_target
payload: parcel
objects:
  - name: drop_target
    kind: bullseye
    size_m: 5.0
    at: {east_m: 10.0, north_m: 15.0}
  - name: parcel
    kind: payload
    mass_kg: 0.5
    size_m: [0.10, 0.10, 0.10]
    carried: true
wind: {level: calm}
expect_log:
  - "Actuation lock on"
  - "Closing sprayer for payload drop"
forbid_log:
  - "Actuation lock: the sprayer command was not sent"
  - "TAKEOVER"
