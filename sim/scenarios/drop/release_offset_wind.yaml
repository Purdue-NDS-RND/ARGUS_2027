# drop/gated_wind with the release offset model on (CEN-08) and its K left at 0: nothing is shifted, and the
# mission logs the height and the vehicle's lean at the release. Flown over several seeds, the runs are what
# `python3 tools/release_offset_fit.py --runs sim/.state/suites/drop-release_offset_wind-*/runs/*` fits K from.
description: Drop a real 0.2 kg package in strong wind with the release offset model on (K at 0, so the lean and height at the release are only logged, for the fit).
mission: drop
site: apollo_xi
seed: 1
timeout_s: 600
sequence: package_drop_demo.yaml
params: sim_target_mission.yaml
sim_time: true
flags:
  use_frame_time_pose: true
  use_target_estimator: true
  use_height_estimator: true
  centre_on_estimator: true
  centring_retune: true
  use_ring_fit: true
  drop_release_gates: true
  release_offset_model: true
node_flags:
  target_cv:
    stamp_from_image: true
    detection_contract: true
  ring_fit:
    ring_fit: true
config:
  package_drop:
    fake_drop: false
    airframe: sim_iris_parcel   # the parcel hangs 0.13 m left of the vehicle's centre: it, not the vehicle, is put over the target
targets:
  package_drop: drop_target
payload: parcel
objects:
  - name: drop_target
    kind: bullseye
    size_m: 5.0
    at: {east_m: 10.0, north_m: 15.0}
  - name: parcel
    kind: payload
    mass_kg: 0.2   # not 0.5: with half a kilogram on it the sim's Iris cannot hold its height in this wind, flags on or off (docs/results/2026-11-20-gate-G2.md)
    size_m: [0.10, 0.10, 0.10]
    carried: true
wind: {level: strong, direction_deg: 225.0}
expect_log:
  - "release offset: height"
