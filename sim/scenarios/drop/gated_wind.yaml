# drop/gated in the sim's strong wind (7 m/s from the south-west, with gusts): the windy half of gate G2.
# The package is real (0.2 kg on the vehicle's release joint) and the judge scores where it comes to rest,
# so the wind's push on the falling package is part of the error. Variant "off" is the 2026 drop with the
# same package in the same wind: a fixed column from 8 m and a release at 4 m after a hover.
description: Drop a real 0.2 kg package from 2.4 m when the release gates hold, in strong wind.
mission: drop
site: apollo_xi
seed: 1
timeout_s: 600
sequence: package_drop_demo.yaml
params: sim_target_mission.yaml
sim_time: true
flags:
  use_frame_time_pose: true
  use_target_estimator: true
  use_height_estimator: true
  centre_on_estimator: true
  centring_retune: true
  use_ring_fit: true
  drop_release_gates: true
node_flags:
  target_cv:
    stamp_from_image: true
    detection_contract: true
  ring_fit:
    ring_fit: true
config:
  package_drop:
    fake_drop: false
    airframe: sim_iris_parcel   # the parcel hangs 0.13 m left of the vehicle's centre: it, not the vehicle, is put over the target
targets:
  package_drop: drop_target
payload: parcel
objects:
  - name: drop_target
    kind: bullseye
    size_m: 5.0
    at: {east_m: 10.0, north_m: 15.0}
  - name: parcel
    kind: payload
    mass_kg: 0.2   # not 0.5: with half a kilogram on it the sim's Iris cannot hold its height in this wind, flags on or off (docs/results/2026-11-20-gate-G2.md)
    size_m: [0.10, 0.10, 0.10]
    carried: true
wind: {level: strong, direction_deg: 225.0}
