# The near-field ring fit (CEN-13) where the box detector fails: a hold at 2 m
# in strong wind over the 1.5 m bullseye of the calm holds. In a 7 m/s wind
# the vehicle holds a tilt of about 8 degrees, the camera's view moves by
# 0.3 m, and the 2026 detector's box runs into the picture's edge about half
# the time; the estimator does not take a cut box as a centre, and without
# the ring fit the track was lost 30 to 40 times in this flight.
# In variant "on" the ring_fit node runs (queue of one, each frame levelled
# with the vehicle's attitude), and the estimator takes its centres beside
# the box detector's (use_ring_fit). Variant "off" is the 2026 centring.
description: Hold over a 1.5 m bullseye at 2 m for 20 s in strong wind, with the near-field ring fit feeding the estimator.
mission: drop
site: apollo_xi
seed: 1
timeout_s: 600
sequence: package_drop_demo.yaml
params: sim_target_mission.yaml
sim_time: true
flags:
  use_frame_time_pose: true
  use_target_estimator: true
  centre_on_estimator: true
  centring_retune: true
  use_ring_fit: true
node_flags:
  target_cv:
    stamp_from_image: true
    detection_contract: true
  ring_fit:
    ring_fit: true
config:
  package_drop:
    drop_altitude_m: 2.2          # with the tolerance, never commanded under 1.9 m: above the 1.83 m floor
    drop_altitude_tolerance_m: 0.3
    drop_column_handoff_altitude_m: 0.0
    centering_dwell_s: 20.0
    drop_hover_dwell_s: 0.0
judge:
  hold_height_m: 2.0
targets:
  package_drop: drop_target
objects:
  - name: drop_target
    kind: bullseye
    size_m: 1.5
    rings: 4
    at: {east_m: 10.0, north_m: 15.0}
wind: {level: strong, direction_deg: 225.0}
