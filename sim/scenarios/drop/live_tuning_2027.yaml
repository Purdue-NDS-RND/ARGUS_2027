# The 2027 drop sequence's own tuning, flown in the sim (CEN-10, CEN-11).
# sim_package_drop_2027.yaml is package_drop_2027.yaml with sim coordinates,
# the sim camera and fake_drop on: every height, rate and tolerance is the one
# the aircraft would fly. Variant "off" is every flag false, which is the
# 2026 live file's flight (as drop/live_tuning); variant "on" turns on the
# flight flags the drop has (all but time_health_guard and
# enforce_safety_limits), so the gated release is flown with the live file's
# descent rate, handoff height and recovery settings, not the demo's.
description: The 2027 drop sequence with its live tuning, flags off and on, bullseye 18 m from the takeoff point, calm.
mission: drop
site: apollo_xi
seed: 1
timeout_s: 600
sequence: sim_package_drop_2027.yaml
params: sim_target_mission.yaml
launch: package_drop_demo.launch.py
sim_time: true
flags:
  use_frame_time_pose: true
  use_target_estimator: true
  use_height_estimator: true
  centre_on_estimator: true
  centring_retune: true
  use_ring_fit: true
  smart_reacquire: true
  drop_release_gates: true
node_flags:
  target_cv:
    stamp_from_image: true
    detection_contract: true
  ring_fit:
    ring_fit: true
targets:
  package_drop: drop_target
objects:
  - name: drop_target
    kind: bullseye
    size_m: 5.0
    at: {east_m: 10.0, north_m: 15.0}
wind: {level: calm}
