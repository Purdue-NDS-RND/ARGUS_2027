# drop/release in a steady 6 m/s west wind (SIM-06 with SIM-03): the wind
# pushes on the vehicle and on the package, hanging and falling, so the
# package comes to rest downwind of where it was let go.
# No flags: off and on fly the same 2026 mission.
description: 2026 drop mission releasing a real 0.5 kg package in a steady 6 m/s wind.
mission: drop
site: apollo_xi
seed: 1
timeout_s: 600
sequence: package_drop_demo.yaml
params: sim_target_mission.yaml
config:
  package_drop:
    fake_drop: false
targets:
  package_drop: drop_target
payload: parcel
objects:
  - name: drop_target
    kind: bullseye
    size_m: 5.0
    at: {east_m: 10.0, north_m: 15.0}
  - name: parcel
    kind: payload
    mass_kg: 0.5
    size_m: [0.10, 0.10, 0.10]
    carried: true
wind: {mean_mps: 6.0, direction_deg: 270.0}   # from the west: the falling package is carried east
