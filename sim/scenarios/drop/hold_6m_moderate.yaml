# Gate G1's hold at 6 m in moderate wind: drop/hold_6m (the 2026 drop mission
# made to hold over a 1.5 m bullseye for 20 s on TRACK_AND_DESCEND's centring)
# with the wind blowing and, in variant "on", the retuned controller as well
# (centring_retune, CEN-02): soft deadband, Kp 0.6, a speed cap that follows
# the height, a slew limit. The judge reports the vehicle's true distance
# from the target while it held (details.hold_error_p95_m); G1 allows
# 0.20 m in this wind.
# The mission must be centred within its tolerance for 20 s without a break
# before it releases, and the hold has a number only once it has released:
# a hold the wind keeps breaking is a hold that failed.
# Variant "off" is the 2026 centring in the same wind.
description: Hold over the bullseye at 6 m for 20 s in moderate wind; the true error while holding is reported.
mission: drop
site: apollo_xi
seed: 1
timeout_s: 600
sequence: package_drop_demo.yaml
params: sim_target_mission.yaml
sim_time: true
flags:
  use_frame_time_pose: true
  use_target_estimator: true
  centre_on_estimator: true
  centring_retune: true
node_flags:
  target_cv:
    stamp_from_image: true
    detection_contract: true
config:
  package_drop:
    drop_altitude_m: 6.0
    drop_altitude_tolerance_m: 0.3
    drop_column_handoff_altitude_m: 0.0
    centering_dwell_s: 20.0
    drop_hover_dwell_s: 0.0
judge:
  hold_height_m: 6.0
targets:
  package_drop: drop_target
objects:
  - name: drop_target
    kind: bullseye
    size_m: 1.5
    rings: 4
    at: {east_m: 10.0, north_m: 15.0}
wind: {level: moderate, direction_deg: 225.0}
