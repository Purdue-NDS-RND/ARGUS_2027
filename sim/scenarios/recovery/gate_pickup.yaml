# Gate G5's flight: recovery/pickup_oracle (the recovery mission on the sim's oracle detector, a stand-in) with the
# two things the gate asks for. The pickup's coordinates are off by up to 8 m, in a direction and by an amount the
# seed draws. And the GPS fix steps 5 m north for 10 s, 41 s after arming: in the gate's first ten flights the
# descent onto the handle ran from 28 to 39 s after arming (CENTRE's height) to 45 to 57 s (the engage), so the
# step comes with the hook on its way down in every one. (That first run had the step at 58 s, which fell in the
# climb and the return in eight flights of ten: it did not test what the gate asks.) No log line is expected: the
# gate counts the flights the judge scores.
description: Gate G5 - the recovery mission on the oracle detector, with the pickup coordinates up to 8 m off and a 5 m GPS glitch in the descent.
mission: recovery
site: apollo_xi
seed: 1
timeout_s: 600
sequence: sim_package_recovery.yaml
params: sim_recovery_mission.yaml
sim_time: true
sensor_profile: recovery
truth_poses: true
flags:
  use_frame_time_pose: true
  use_target_estimator: true
  use_height_estimator: true
  package_recovery: true
node_flags:
  loc_node:
    loc_node: true
    sim_oracle_detector: true
targets:
  package_recovery: bucket
bucket: bucket
objects:
  - {name: x_mat, kind: x_mat, at: {east_m: 12.0, north_m: 8.0}}
  - {name: bucket, kind: bucket, mass_kg: 1.0, at: {east_m: 12.0, north_m: 8.0}}
wind: {level: calm}
coordinate_error: {max_radius_m: 8.0}
gps_events:
  - {at_s: 41.0, kind: glitch, north_m: 5.0, for_s: 10.0}
