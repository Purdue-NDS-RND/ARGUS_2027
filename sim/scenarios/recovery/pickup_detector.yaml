# The recovery mission in the sim (REC-2) on the green X and bucket detector (REC-1), with the detector's near field
# (REC-5's hand-off). From the transit height down to about 3 m the detector gives the X and the bucket on its
# crossing; below that the mat fills the picture, no X can be fitted, and the detector gives the bucket by itself.
# The mission flies to the pickup's coordinates, takes the track, approaches, centres 3 m above the handle, comes
# down the cone on the bucket's track (CONFIRMED all the way: the descend and release rules are unchanged), engages,
# lifts, verifies the attach, and takes the bucket home.
#
# Before the near field this scenario showed the mission refusing to descend blind: the detections stopped at 3 m,
# the cone held, and after three descents the mission failed to RTL. No sim scenario shows that any more; the rule
# is held by unit tests of the flight (src/drone_mission_core/test/test_recovery_flight.py:
# test_a_detector_that_sees_nothing_below_three_metres_ends_in_three_lost_descents and
# test_no_descent_below_point_eight_after_the_handle_is_lost).
description: The recovery mission on the green X and bucket detector as built - from takeoff to the bucket set down at the takeoff point.
mission: recovery
site: apollo_xi
seed: 1
timeout_s: 600
sequence: sim_package_recovery.yaml
params: sim_recovery_mission.yaml
sim_time: true
sensor_profile: recovery
truth_poses: true
flags:
  use_frame_time_pose: true
  use_target_estimator: true
  use_height_estimator: true
  package_recovery: true
node_flags:
  recovery_cv:
    recovery_cv: true
targets:
  package_recovery: bucket
bucket: bucket
objects:
  - {name: x_mat, kind: x_mat, at: {east_m: 12.0, north_m: 8.0}}
  - {name: bucket, kind: bucket, mass_kg: 1.0, at: {east_m: 12.0, north_m: 8.0}}
expect_log:
  - "State: CENTRE -> CONE_DESCENT"
  - "State: CONE_DESCENT -> ENGAGE"
  - "State: VERIFY_ATTACH -> CLIMB"
  - "done: the bucket is set down"
wind: {level: calm}
