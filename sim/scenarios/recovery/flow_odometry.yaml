# REC-5: the flow odometry in a flight. The recovery of recovery/pickup_oracle (transit at 15 m, approach to 6 m,
# the cone, the carry home) with the node flag flow_odometry on: every frame of the recovery vehicle's flow camera
# (320 x 200 at 20 Hz in the sim, the hook hanging in the middle of it) becomes a velocity sample from the four
# corner patches, turning taken out with the pose history, scaled by the rangefinder. sim/flow_check.py holds the
# samples against Gazebo's true velocity: the spec's line is an RMS of 0.15 m/s at 5 to 15 m.
#
# The bullseyes and markers are there as ground to look at, not as targets: to the sim's mono flow camera the grass
# is black, and without them the only thing in the picture is the mat and the hook. What the odometry does over
# that bare ground is reported by the same check (no quality, and why).
#
# Flown with --variants on. As built (REC-5) this run FAILS its check: the RMS at 5 to 15 m is 0.33 m/s, and under
# 5 m it is 0.02 to 0.05 m/s (docs/results/2026-11-24-flow-odometry-and-near-field.md). It is kept as the measure.
description: The recovery mission of recovery/pickup_oracle with the flow odometry on - its velocity is held against the true velocity.
mission: recovery
site: apollo_xi
seed: 1
timeout_s: 600
sequence: sim_package_recovery.yaml
params: sim_recovery_mission.yaml
sim_time: true
sensor_profile: recovery
truth_poses: true
flags:
  use_frame_time_pose: true
  use_target_estimator: true
  use_height_estimator: true
  package_recovery: true
node_flags:
  loc_node:
    loc_node: true
    sim_oracle_detector: true
  flow_odometry:
    flow_odometry: true
targets:
  package_recovery: bucket
bucket: bucket
