# Suites for sim/run_scenarios.sh: which scenarios, seeds and variants each flies.
# Variant "off" is every flag false (the 2026 behaviour); "on" is the scenario's flags.
# Quote "off" and "on": bare, YAML reads them as false and true.

# One flight of the 2026 delivery. Tier C: run it before a pull request that touches missions, CV or sim.
smoke:
  scenarios: [delivery/baseline]
  seeds: [1]
  variants: ["off"]

# Everything, three seeds, 2026 against 2027.
nightly:
  scenarios:
    - delivery/baseline
    - delivery/clutter
    - delivery/time_base
    - delivery/frame_time
    - delivery/estimator
    - delivery/release
    - delivery/wind_moderate
    - delivery/wind_strong
    - hover/wind_5
    - drop/baseline
    - drop/release
    - drop/release_wind
    - waypoint_navigation/site_circuit
    - geofence/breach
  seeds: [1, 2, 3]
  variants: ["off", "on"]

# The acceptance gates are suites too: `sim/run_scenarios.sh G0` flies one gate
# and `sim/run_scenarios.sh gates` flies every gate that has scenarios. They are
# defined with their pass rules in gates.yaml, not here.
