# Suites for sim/run_scenarios.sh: which scenarios, seeds and variants each flies.
# Variant "off" is every flag false (the 2026 behaviour); "on" is the scenario's flags.
# Quote "off" and "on": bare, YAML reads them as false and true.

# One flight of the 2026 delivery. Tier C: run it before a pull request that touches missions, CV or sim.
smoke:
  scenarios: [delivery/baseline]
  seeds: [1]
  variants: ["off"]

# Everything, three seeds, 2026 against 2027.
nightly:
  scenarios:
    - delivery/baseline
    - delivery/live_tuning
    - delivery/live_tuning_2027
    - delivery/live_tuning_2027_wind
    - delivery/clutter
    - delivery/time_base
    - delivery/frame_time
    - delivery/estimator
    - delivery/height_estimator
    - delivery/centring
    - delivery/release
    - delivery/wind_moderate
    - delivery/wind_strong
    - hover/wind_5
    - hover/survey_camera
    - hover/still4k_camera
    - hover/gps_glitch
    - drop/baseline
    - drop/live_tuning
    - drop/live_tuning_2027
    - drop/live_tuning_2027_wind
    - drop/hold_6m
    - drop/hold_2m
    - drop/hold_6m_payload
    - drop/hold_6m_moderate
    - drop/hold_6m_strong
    - drop/hold_2m_moderate
    - drop/hold_2m_strong
    - drop/hold_2m_ring_fit
    - drop/release
    - drop/release_wind
    - delivery/set_down
    - delivery/set_down_floor
    - drop/gated
    - drop/gated_track_loss
    - drop/gated_timeout
    - drop/gated_floor
    - drop/reacquire
    - waypoint_navigation/site_circuit
    - geofence/breach
  seeds: [1, 2, 3]
  variants: ["off", "on"]

# The acceptance gates are suites too: `sim/run_scenarios.sh G0` flies one gate
# and `sim/run_scenarios.sh gates` flies every gate that has scenarios. They are
# defined with their pass rules in gates.yaml, not here.
