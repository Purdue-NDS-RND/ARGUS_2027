# Seven waypoints inside the Apollo XI placeholder boundary, flown with the
# 2026 GPS waypoint mission. The 2026 route (competition_waypoints.yaml) is at
# last year's field, so the scenario supplies its own.
description: 2026 waypoint navigation mission on a seven-point circuit at the 2027 site.
mission: waypoint_navigation
site: apollo_xi
seed: 1
timeout_s: 900
sequence: waypoint_navigation_live.yaml
params: mission_params.yaml
waypoints:
  mission: waypoint_navigation
  points:
    - {name: wp1, east_m: 40.0, north_m: 20.0, height_m: 15.24}
    - {name: wp2, east_m: 100.0, north_m: 40.0, height_m: 30.0}
    - {name: wp3, east_m: 110.0, north_m: 120.0, height_m: 30.0}
    - {name: wp4, east_m: 30.0, north_m: 150.0, height_m: 15.24}
    - {name: wp5, east_m: -60.0, north_m: 140.0, height_m: 30.0}
    - {name: wp6, east_m: -110.0, north_m: 60.0, height_m: 30.0}
    - {name: wp7, east_m: -50.0, north_m: -20.0, height_m: 15.24}
wind: {level: calm}
