# The survey's height guard, RECOVER (LOC-1, flown by LOC-3): the survey of survey.yaml, and 40 s after arming,
# in the middle of the survey, the rangefinder reads 0.75 of the true range for eight seconds, as it would
# over ground that rose 2.7 m under the vehicle. (The sim's rangefinder is SITL's own, over flat ground: it
# cannot see anything in the Gazebo world, so the dip is made in the sensor; sim/inject.py.) The height above
# the ground is then 8.0 m: under the guard's 8.22 m and over its 7.77 m. The survey must wait where it is,
# climb until the height is back, and go on to fly all three tracks: the judge wants every track end passed in
# order, by east and north only (the vehicle is higher than the survey height after its climb). The heights
# and the mission's own lines are read from the run's trace and log (docs/results/2026-11-20-survey-height-guard.md).
# The height check beside the flight leaves the heights of the fault's time unjudged. The guard's own lines must
# be in the mission's log (`expect_log`): the track ends are passed whether or not it acted.
# Variant "off" is every flag false: the survey mission is skipped.
description: Survey with the rangefinder reading 0.75 of the range for 8 s; the height guard waits, climbs back and the survey goes on.
mission: waypoint_navigation
site: apollo_xi
seed: 1
timeout_s: 600
sequence: search_pattern_demo.yaml
params: mission_params.yaml
sim_time: true
sensor_profile: survey
dds_profile: large_frames
flags:
  use_frame_time_pose: true
  use_height_estimator: true
  survey_search: true
survey:
  mission: search_pattern
  boundary: true
  area:
    - {east_m: 20.0, north_m: 10.0}
    - {east_m: 80.0, north_m: 10.0}
    - {east_m: 80.0, north_m: 50.0}
    - {east_m: 20.0, north_m: 50.0}
waypoints:
  mission: search_pattern
  points:
    - {name: track1_start, east_m: 20.0, north_m: 17.92, height_m: 10.668}
    - {name: track1_end, east_m: 80.0, north_m: 17.92, height_m: 10.668}
    - {name: track2_start, east_m: 80.0, north_m: 30.0, height_m: 10.668}
    - {name: track2_end, east_m: 20.0, north_m: 30.0, height_m: 10.668}
    - {name: track3_start, east_m: 20.0, north_m: 42.08, height_m: 10.668}
    - {name: track3_end, east_m: 80.0, north_m: 42.08, height_m: 10.668}
judge:
  tolerance_m: 2.5
  dimensions: 2
expect_log:
  - "is under 8.22 m: climbing back"
  - "back at the survey height"
  - "survey finished: 3 of 3 tracks flown"
wind: {level: calm}
gps_events:
  - {at_s: 40.0, kind: rangefinder, scale: 0.75, for_s: 8.0}
