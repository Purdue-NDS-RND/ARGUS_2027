# The 2026 delivery with projection v2 (FND-05). In variant "on" the sim is on
# one clock as in delivery/time_base (sim time, MAVROS rates held, detections
# stamped with their image's time), and the mission flag use_frame_time_pose
# is on: the mission steers on the target's ground point found with the pose
# at the frame's capture time, the sim camera's own calibration and mount
# (camera_mode and airframe in package_delivery_demo.yaml).
# sim/projection_check.py runs beside the flight and the run only counts if
# the projected bullseye is within 0.3 m of where the scenario put it, at
# 15 m. Variant "off" is the plain 2026 baseline on wall time.
description: 2026 delivery mission steering on projection v2, with the projected target checked against the truth.
mission: delivery
site: apollo_xi
seed: 1
timeout_s: 600
sequence: package_delivery_demo.yaml
params: sim_target_mission.yaml
sim_time: true
flags:
  use_frame_time_pose: true
node_flags:
  target_cv:
    stamp_from_image: true
targets:
  package_delivery: delivery_target     # the mission is given this object's coordinates
objects:
  - name: delivery_target
    kind: bullseye
    size_m: 5.0
    at: {east_m: 10.0, north_m: 15.0}   # where the 2026 sim baseline had it
wind: {level: calm}
