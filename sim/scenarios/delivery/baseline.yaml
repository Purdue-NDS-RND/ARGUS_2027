# The 2026 package delivery, as flown, at the 2027 site: take off, find the
# bullseye, descend onto it, fake the release, relaunch and return.
# With no flags this is the flags-off baseline that gate G0 measures.
description: 2026 delivery mission, bullseye 18 m from the takeoff point, calm.
mission: delivery
site: apollo_xi
seed: 1
timeout_s: 600
sequence: package_delivery_demo.yaml
params: sim_target_mission.yaml
targets:
  package_delivery: delivery_target     # the mission is given this object's coordinates
objects:
  - name: delivery_target
    kind: bullseye
    size_m: 5.0
    at: {east_m: 10.0, north_m: 15.0}   # where the 2026 sim baseline had it
wind: {level: calm}
