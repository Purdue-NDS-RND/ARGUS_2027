# The 2027 delivery: down on the estimator to the ground, and a soft set-down (CEN-05).
# With the flags on, the delivery mission centres the package on the
# estimator's track with the retuned controller, comes down to 6 m as before,
# and then FINAL_SET_DOWN takes the place of the fixed GPS column: it goes on
# down on the estimator (the ring fit keeps the track once the 5 m bullseye
# no longer fits the picture), holds its position below 0.6 m and descends at
# 0.12 m/s, and takes contact from the rangefinder, the vertical speed and
# the throttle together for 0.3 s. Then it opens the gripper, waits a second
# and climbs.
# The package is real (0.5 kg on the vehicle's release joint; the airframe
# row sim_iris_parcel says where it hangs) and the judge scores where it
# comes to rest and the hardest contact. The sequence's `package_height_m`
# (0.05 m) is what the sim's rangefinder reads with the vehicle standing
# (0.01 m) plus a margin.
# Variant "off" is the 2026 delivery with the same package: a fixed column
# from 6 m, the flight controller's "landed" plus 0.5 s, then 5 s on the ground.
description: Set a real 0.5 kg package down on the estimator, releasing on contact, calm.
mission: delivery
site: apollo_xi
seed: 1
timeout_s: 600
sequence: package_delivery_demo.yaml
params: sim_target_mission.yaml
sim_time: true
flags:
  use_frame_time_pose: true
  use_target_estimator: true
  use_height_estimator: true
  centre_on_estimator: true
  centring_retune: true
  use_ring_fit: true
  delivery_soft_set_down: true
node_flags:
  target_cv:
    stamp_from_image: true
    detection_contract: true
  ring_fit:
    ring_fit: true
config:
  package_delivery:
    fake_drop: false
    airframe: sim_iris_parcel
targets:
  package_delivery: delivery_target
payload: parcel
bucket: pail
objects:
  - name: delivery_target
    kind: bullseye
    size_m: 5.0
    at: {east_m: 10.0, north_m: 15.0}
  - name: parcel
    kind: payload
    mass_kg: 0.5
    size_m: [0.10, 0.10, 0.10]
    carried: true
  - name: pail
    kind: bucket
    mass_kg: 1.5
    at: {east_m: -8.0, north_m: 0.0}
wind: {level: calm}
