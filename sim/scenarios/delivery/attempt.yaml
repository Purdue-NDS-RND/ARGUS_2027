# PLT-12: a delivery as an attempt. The GO command (comp_2026) records the
# flight's bag of key topics; after the landing the flight controller's log
# is pulled over MAVLink (tools/dataflash_pull.py) and the attempt's folder is
# made (tools/bundle_attempt.py): bag, dataflash log, config, flag profile,
# git hash, the preflight's log, and a manifest. The run counts only if the
# bundle is complete, every file is as the manifest says, the bag holds the
# vehicle's pose and state and no image, and the pulled log is byte for byte
# the file SITL wrote (sim/attempt_check.py).
#
# Flown with --variants on (sim time, no flag on). Not in the nightly suite.
description: 2026 delivery flown as an attempt - the GO command records the bag, the flight controller's log is pulled after the landing, and the attempt's bundle must be whole.
mission: delivery
site: apollo_xi
seed: 1
timeout_s: 600
sequence: package_delivery_demo.yaml
params: sim_target_mission.yaml
sim_time: true
targets:
  package_delivery: delivery_target     # the mission is given this object's coordinates
objects:
  - name: delivery_target
    kind: bullseye
    size_m: 5.0
    at: {east_m: 10.0, north_m: 15.0}   # where the 2026 sim baseline had it
wind: {level: calm}
sitl_params:                  # the 2027 baseline (platform/fcu/argus_2027.param), value for value: a test holds the two together
  SIM_BATT_VOLTAGE: 25.0      # a 6S pack, charged
  BATT_LOW_VOLT: 21.0
  BATT_CRT_VOLT: 19.8
  BATT_LOW_TIMER: 10.0
  BATT_FS_LOW_ACT: 2.0
  BATT_FS_CRT_ACT: 1.0
  FS_THR_ENABLE: 1.0
  FS_THR_VALUE: 975.0
  FS_GCS_ENABLE: 1.0
  FS_GCS_TIMEOUT: 5.0
  FS_EKF_ACTION: 1.0
  FS_EKF_THRESH: 0.8
  FS_OPTIONS: 16.0
  GRIP_ENABLE: 1.0
  GRIP_TYPE: 1.0
  SERVO7_FUNCTION: 28.0
  GRIP_GRAB: 1900.0
  GRIP_RELEASE: 1100.0
  GRIP_NEUTRAL: 1500.0
  EK3_SRC_OPTIONS: 0.0
  GPS2_TYPE: 0.0
preflight:
  expect: GO
  cameras:
    /camera/image: 15         # the sim's delivery camera: it renders at 20 to 26 Hz on a laptop
  go:
    profile: comp_2026
    detector: target_cv
    attempt: sim              # the attempt's slot: the bundle is <run folder>/attempts/<date>_sim_delivery
