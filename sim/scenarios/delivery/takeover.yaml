# The takeover latch in a flight (PLT-09). The 2026 delivery, with the flag takeover_latch on. 45 s after
# arming, in the middle of the mission, sim/inject.py changes the flight mode to LOITER, as the safety pilot's
# switch would; 15 s later it asks for LAND, as the pilot would land. The executor must say TAKEOVER once and
# then do nothing: no setpoint, no mission tick, no abort, no mode request (the log lines it must not have).
# The delivery is not made, so the judge scores nothing for it: the flight counts by its log and by ending
# down and disarmed. Flown with --variants on. Not in the nightly suite.
description: 2026 delivery mission with the takeover latch on - a mode change in mid-flight must stop the executor for good.
mission: delivery
site: apollo_xi
seed: 1
timeout_s: 600
sequence: package_delivery_demo.yaml
params: sim_target_mission.yaml
targets:
  package_delivery: delivery_target     # the mission is given this object's coordinates
objects:
  - name: delivery_target
    kind: bullseye
    size_m: 5.0
    at: {east_m: 10.0, north_m: 15.0}   # where the 2026 sim baseline had it
wind: {level: calm}
flags:
  takeover_latch: true
node_flags:
  simple_takeoff_service:
    takeoff_cancel: true                      # the take-off node offers its cancel, which the latch calls at the takeover
gps_events:
  - {at_s: 45.0, kind: mode, mode: LOITER}   # the safety pilot's switch, in the middle of the mission
  - {at_s: 60.0, kind: mode, mode: LAND}     # and the pilot's landing
expect_log:
  - "TAKEOVER: the mode went from GUIDED to LOITER"
forbid_log:
  - "Mission failure policy triggered abort"
  - "Abort RTL mode request sent"
  - "Mission 'package_delivery' completed"
