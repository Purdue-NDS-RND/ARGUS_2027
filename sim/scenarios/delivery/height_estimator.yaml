# The 2026 delivery with the height estimator on (CEN-03). In variant "on"
# the sim is on one clock as in delivery/frame_time, and the mission flags
# use_frame_time_pose and use_height_estimator are on: the executor makes a
# height estimator fed by MAVROS's rangefinder and the pose history, which a
# mission reads through context.height_agl(). No mission reads it yet (the
# drop's release height does, CEN-04), so the flight itself is
# delivery/frame_time's. sim/height_check.py runs the same estimator beside
# the flight on the same topics, and the run only counts if its height is the
# rangefinder's from 11 m down, within 0.10 m of the true height, and the
# barometer's above the sensor's 12 m range. The delivery starts at 15 m and
# ends on the ground, so the flight has both.
# Variant "off" is the 2026 baseline on wall time.
description: 2026 delivery mission with the height estimator on, its height and source checked against the true height.
mission: delivery
site: apollo_xi
seed: 1
timeout_s: 600
sequence: package_delivery_demo.yaml
params: sim_target_mission.yaml
sim_time: true
flags:
  use_frame_time_pose: true
  use_height_estimator: true
node_flags:
  target_cv:
    stamp_from_image: true
targets:
  package_delivery: delivery_target     # the mission is given this object's coordinates
objects:
  - name: delivery_target
    kind: bullseye
    size_m: 5.0
    at: {east_m: 10.0, north_m: 15.0}   # where the 2026 sim baseline had it
wind: {level: calm}
