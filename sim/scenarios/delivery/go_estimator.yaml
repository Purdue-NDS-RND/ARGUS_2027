# PLT-07: the delivery started by the GO command with a 2027 profile
# (profiles/delivery_estimator.yaml): two mission flags through the
# executor's feature_overrides and two node flags through the bringup
# launch's node_flags. The run's own sequence and params files keep every
# flag false, as the shipped ones do: the flags reach the flight only through
# the profile. The estimator's and the projection's checks run beside it (as
# in delivery/estimator), so a flag that did not arrive fails the run.
#
# Flown with --variants on. Not in the nightly suite.
description: The delivery started by the GO command with the delivery_estimator profile - the preflight says GO and the flags reach the executor and target_cv through the bringup launch.
mission: delivery
site: apollo_xi
seed: 1
timeout_s: 600
sequence: package_delivery_demo.yaml
params: sim_target_mission.yaml
sim_time: true
flags:
  use_frame_time_pose: true
  use_target_estimator: true
node_flags:
  target_cv:
    stamp_from_image: true
    detection_contract: true
targets:
  package_delivery: delivery_target     # the mission is given this object's coordinates
objects:
  - name: delivery_target
    kind: bullseye
    size_m: 1.5
    at: {east_m: 10.0, north_m: 15.0}   # where the 2026 sim baseline had it
wind: {level: calm}
sitl_params:                  # the 2027 baseline (platform/fcu/argus_2027.param), value for value: a test holds the two together
  SIM_BATT_VOLTAGE: 25.0      # a 6S pack, charged
  BATT_LOW_VOLT: 21.0
  BATT_CRT_VOLT: 19.8
  BATT_LOW_TIMER: 10.0
  BATT_FS_LOW_ACT: 2.0
  BATT_FS_CRT_ACT: 1.0
  FS_THR_ENABLE: 1.0
  FS_THR_VALUE: 975.0
  FS_GCS_ENABLE: 1.0
  FS_GCS_TIMEOUT: 5.0
  FS_EKF_ACTION: 1.0
  FS_EKF_THRESH: 0.8
  FS_OPTIONS: 16.0
  GRIP_ENABLE: 1.0
  GRIP_TYPE: 1.0
  SERVO7_FUNCTION: 28.0
  GRIP_GRAB: 1900.0
  GRIP_RELEASE: 1100.0
  GRIP_NEUTRAL: 1500.0
  SPRAY_ENABLE: 1.0           # the drop's release, as the baseline and sim/payload_bridge.py set it
  SPRAY_SPEED_MIN: 0.0
  SPRAY_PUMP_MIN: 100.0
  SERVO8_FUNCTION: 22.0
  EK3_SRC_OPTIONS: 0.0
  GPS2_TYPE: 0.0
preflight:
  expect: GO
  cameras:
    /camera/image: 15         # the sim's delivery camera: it renders at 20 to 26 Hz on a laptop
  go:
    profile: delivery_estimator
    detector: target_cv
