# GENERATED by tools/sim_sequence_copies.py from package_delivery_live.yaml: do not edit.
# The live file with sim coordinates, the sim camera named and fake_drop on, and
# nothing else changed, so its tuning can be flown in Gazebo (the live_tuning
# scenarios under sim/scenarios/). After changing the live file, run
# python3 tools/sim_sequence_copies.py --write
mission_sequence:
  on_failure: abort_and_rtl                         # Abort the remaining sequence and request RTL on failure.
  features:                                         # Mission feature flags; a missing flag means false.
    use_frame_time_pose: false                      # Keep 5 s of pose history in the executor (pose_buffer.py).
    use_target_estimator: false # Run the target estimator in the executor (target_estimator.py). Needs use_frame_time_pose.
    enforce_safety_limits: false # Refuse to start if a configured height breaks a rule limit (safety_limits.py).
    time_health_guard: false # Treat a stale pose, a stale frame or a time-sync jump as no target: hold, no descent (time_health.py).
    use_height_estimator: false # Height above ground from the rangefinder, the barometer otherwise, with its source (height_estimator.py). Needs use_frame_time_pose.
  missions:
    - type: takeoff                                # Mission type registered in the mission framework.
      name: takeoff                                # Human-readable mission instance name for logs.
      config:
        target_altitude_m: 15.0                    # Target climb altitude after takeoff in meters.

    - type: package_delivery                       # Vision-guided touch-and-go delivery mission.
      name: package_delivery                       # Human-readable mission instance name for logs.
      failure_policy: continue_to_next             # Keep the sequence running after this mission fails.
      config:
        # Sim copy: the sim's default target; a scenario sets its own object's position.
        target_latitude: -35.3631271               # GPS latitude of the delivery target.
        target_longitude: 149.1653479              # GPS longitude of the delivery target.
        camera_mode: sim_delivery # Sensor mode the detector's images come from (argus_camera modes.yaml). Read only with use_frame_time_pose on.
        airframe: sim_iris_downcam # Airframe whose camera mount is used (argus_camera robot.yaml). Read only with use_frame_time_pose on.
        transit_altitude_m: 15.0                   # Cruise altitude used while flying to the target area.
        landing_check_threshold_m: 8.0             # Altitude where delivery switches to touchdown logic.
        touchdown_handoff_tolerance_m: 3         # Separate altitude tolerance for the final fixed-column handoff.
        relaunch_altitude_m: 12.0                  # Altitude to climb back to after delivery is complete.
        fake_drop: true                             # Simulate payload delivery without releasing the gripper actuator.
        descent_rate_mps: 0.4                     # Normal descent speed while centered over the target.
        final_descent_rate_mps: 0.14               # Slower descent speed near touchdown.
        touchdown_min_altitude_m: -5.0             # Lowest home-relative final touchdown setpoint; allows lower target ground.
        delivery_dwell_s: 5.0                      # Time to remain on the ground before relaunch.
        guided_relaunch_rate_mps: 0.6              # Commanded climb rate for guided relaunch.
        guided_relaunch_max_climb_rate_mps: 2.5    # Maximum climb rate clamp during relaunch.
        camera_fx_px: 2334.99647                   # Camera focal length in pixels along the x-axis.
        camera_fy_px: 2338.06625                   # Camera focal length in pixels along the y-axis.
        camera_calibration_width_px: 3840.0        # Image width used when the camera intrinsics were calibrated.
        camera_calibration_height_px: 2160.0       # Image height used when the camera intrinsics were calibrated.
        camera_yaw_offset_deg: 0.0                 # Fixed yaw rotation between the camera and vehicle body.
        centering_tolerance_m: 0.8                # Ground-error threshold considered centered enough to descend.
        centering_deadband_m: 0.5                 # Small projected errors below this are treated as zero.
        tracking_low_pass_alpha: 0.12              # Low-pass filter weight; higher values react faster but noisier.
        centering_gain_mps_per_m: 0.15             # XY velocity gain applied to projected ground error.
        max_centering_speed_mps: 0.45              # Maximum commanded lateral tracking speed.
        arrival_radius_m: 3.0                      # Horizontal GPS radius used to declare arrival at the target area.
        arrival_alt_tolerance_m: 2.0               # Altitude tolerance used when checking target heights.
        not_found_ascent_m: 1.0                    # Climb amount per retry when the visual target is lost.
        max_recovery_altitude_m: 40.0              # Hard ceiling for target-recovery climbs.
        max_recovery_attempts: 4                   # Maximum number of visual reacquisition attempts.
        target_loss_grace_s: 4.0                   # Hold briefly on CV loss before starting recovery.
        recovery_alt_tolerance_m: 0.5              # Altitude tolerance for visual recovery climbs.
        min_projection_altitude_m: 0.75            # Minimum altitude where ground projection is considered valid.
        max_projection_distance_m: 25.0            # Reject projected detections farther than this from the drone.
        centering_dwell_s: 0.2                     # Time to remain centered before committing to the next phase.
        touchdown_dwell_s: 0.5                     # Debounce time for landed-state confirmation.
        target_timeout_s: 2.0                      # Detection freshness timeout before the target is considered lost.

    - type: rtl                                    # Return-to-launch mission.
      name: rtl                                    # Human-readable mission instance name for logs.
      config:
        rtl_mode: "RTL"                            # Flight mode string sent to the FCU for return-to-launch.
