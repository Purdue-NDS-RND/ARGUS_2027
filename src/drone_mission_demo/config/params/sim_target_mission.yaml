simple_takeoff_service:
  ros__parameters:
    default_takeoff_altitude_m: 20.0
    guided_mode_name: "GUIDED"
    mode_retry_s: 2.0
    arm_retry_s: 5.0
    max_arm_attempts: 5
    post_arm_settle_s: 5.0
    takeoff_retry_s: 5.0
    loop_rate_hz: 2.0
    stream_rate_hz: 20
    required_topics:
      - "/mavros/local_position/pose"
      - "/mavros/imu/data"
      - "/mavros/extended_state"
    features:
      takeoff_cancel: false  # Offer drone_utils/cancel_takeoff, which the executor's takeover latch calls to drop a pending take-off (PLT-09).

mission_executor:
  ros__parameters:
    loop_rate_hz: 20.0
    abort_rtl_mode: "RTL"

target_cv:
  ros__parameters:
    image_topic: "camera/image"
    debug_view: true
    start_enabled: false
    compressed_input: false
    sim_hsv: true
    min_circularity: 0.4  # 1.0 is circle-like; reject long/irregular red blobs below this.
    features:
      stamp_from_image: false  # Stamp detections with the image's stamp, not this node's clock (detection_stamp.py).
      detection_contract: false  # Also publish on the detection contract, /perception/target_cv/detections (FND-02).

health_monitor:  # The companion computer's health and its lines to the ground station (PLT-11). Only started by a launch given health_monitor:=true.
  ros__parameters:
    rates:                         # the topics whose rate is watched, each name:topic:type:hz (a message is only counted)
      - "camera:camera/image:sensor_msgs/msg/Image:30"
    # The pose is not in the shipped list: it comes at 30 a second only with the stream keeper running (PLT-06), and a
    # start-up without it would be warned about for the whole flight. A flight with the keeper adds
    # "pose:/mavros/local_position/pose:geometry_msgs/msg/PoseStamped:30". Nodes whose own count of frames had and dropped is
    # watched go in frame_counts, each name:topic (the localisation node's is "loc:/loc/status"); none in a delivery.
    send_statustext: true          # findings go to the ground station as STATUSTEXT (false: to the log and /argus/health only)
    temp_limit_c: 85.0             # a thermal zone at or over this is a finding
    cpu_limit_percent: 95.0        # the CPUs this busy for five seconds is a finding
    gpu_limit_percent: 98.0        # the same for the GPU, where the kernel says its load
    drop_limit_share: 0.10         # a node dropping this share of its frames is a finding
    features:
      health_monitor: false        # Watch the rates above and the computer, publish /argus/health and send findings to the ground station (health.py).

ring_fit:  # The near-field bullseye centre finder (CEN-13). Only started by a launch given ring_fit:=true.
  ros__parameters:
    image_topic: "camera/image"
    sim_hsv: true
    camera_mode: "sim_delivery"  # the sensor mode the images come from (argus_camera modes.yaml): its calibration levels the frame
    airframe: "sim_iris_downcam"  # and the airframe whose camera mount does (argus_camera robot.yaml)
    max_height_m: 8.0  # above this height the node does not look. The node's own default is 4 m. The sim's 5 m bullseye stops fitting the picture at 5.4 m when the vehicle is level, and from about 6.3 m when it leans into a strong wind; from there down the box detector's box is cut. 8 m (on the height above home) keeps the two sources overlapping in wind: at 6 m the delivery lost its track there four times in one flight (docs/results/2026-11-20-ab-delivery.md)
    features:
      ring_fit: false  # Fit the bullseye's rings below max_height_m and publish the centre on /perception/ring_fit/detections (ring_fit.py).

session_logger:
  ros__parameters:
    output_base: "~/cuasc_logs"
    session_name: "demo"
    image_interval_s: 1.0
    command_topic: "/mavros/setpoint_raw/local"
    camera_topic: "/camera/image"
    camera_compressed_input: false
    annotated_topic: "/target_cv/annotated"
    mask_topic: "/target_cv/mask"
    debug_topic_warn_after_s: 5.0
