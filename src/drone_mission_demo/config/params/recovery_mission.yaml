# The parameters for a recovery flight (REC-7). The recovery mission's launch (REC-2) passes this file.
#
# It is config/params/mission_params.yaml, value for value (a test holds the two files together), abort_rtl_mode
# RTL among them: a failed recovery comes home, as every other mission does, unless the mission has told the
# executor that the abort is a landing (recovery_return.py, "Abort"): from the first time its gripper closes, so
# that a carrying fault lands with the bucket, which the rules allow, and whenever there is no position to fly
# home on. (Until 23 November 2026 this file had abort_rtl_mode LAND for the whole sequence; the lead's rule
# replaced it.)
simple_takeoff_service:
  ros__parameters:
    default_takeoff_altitude_m: 20.0
    guided_mode_name: "GUIDED"
    mode_retry_s: 2.0
    arm_retry_s: 5.0
    max_arm_attempts: 5
    post_arm_settle_s: 5.0
    takeoff_retry_s: 5.0
    loop_rate_hz: 2.0
    stream_rate_hz: 20
    required_topics:
      - "/mavros/local_position/pose"
      - "/mavros/imu/data"
      - "/mavros/extended_state"
    features:
      takeoff_cancel: false  # Offer drone_utils/cancel_takeoff, which the executor's takeover latch calls to drop a pending take-off (PLT-09).

mission_executor:
  ros__parameters:
    loop_rate_hz: 20.0
    abort_rtl_mode: "RTL"
