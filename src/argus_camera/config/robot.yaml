# The one description of where the cameras and the payload are (PLT-03).
# 2027 code reads mounts and the payload offset only from here.
#
# Body frame: x forward, y left, z up, origin at the flight controller.
# position_m is the lens in that frame. Every camera looks straight down;
# image_yaw_deg turns the image about the lens axis (0: image top toward the
# nose, 180: toward the tail).

airframes:
  argus_2027:
    description: The competition aircraft. Numbers copied from the 2026 files, which disagree; not measured.
    verified: false
    cameras:
      down:
        optical_frame: down_camera_optical
        # 2026 mission_logger: 0.2667 m forward, 0.03 m right, 0.40005 m below.
        position_m: [0.2667, -0.03, -0.40005]
        # The 2026 sequences fly with camera_yaw_offset_deg 0; mission_logger has mount_yaw 180.
        image_yaw_deg: 0.0
        source: position from mission_logger's mount_x/y/z (mipi_params.yaml); yaw from the sequences
      flow:
        optical_frame: flow_camera_optical
        position_m: [0.0, 0.0, 0.0]
        image_yaw_deg: 0.0
        source: not fitted yet; placeholder at the body origin
    payload_offset_m: [0.0, 0.0, 0.0]
    payload_source: not measured; 2026 has no payload offset anywhere

  sim_iris_downcam:
    description: The sim's Iris with the camera hard-mounted looking down (sim/models/iris_downcam).
    verified: true
    cameras:
      down:
        optical_frame: down_camera_optical
        position_m: [0.0, 0.0, 0.0]
        image_yaw_deg: 0.0
        source: sim/models/iris_downcam/model.sdf, sensor pose 0 0 0 0 1.5708 0
    payload_offset_m: [0.0, 0.0, 0.0]

  # Not a vehicle of its own: the sim's Iris described as if its release point
  # were 0.30 m ahead of the flight controller and 0.10 m to its left, so that
  # aiming the payload (CEN-01) can be flown and judged with an offset that is
  # not zero (sim/scenarios/drop/hold_6m_payload.yaml). The camera is the sim
  # Iris's own.
  sim_iris_payload_ahead:
    description: The sim's Iris with a release point taken to be ahead and to the left of the flight controller, for testing payload aiming.
    verified: true
    cameras:
      down:
        optical_frame: down_camera_optical
        position_m: [0.0, 0.0, 0.0]
        image_yaw_deg: 0.0
        source: sim/models/iris_downcam/model.sdf, sensor pose 0 0 0 0 1.5708 0
    payload_offset_m: [0.30, 0.10, -0.25]
    payload_source: chosen for the test; there is no such mount on the sim's vehicle
