# The localisation node's settings (LOC-5). Every flag is false: as shipped, the node does nothing.
loc_node:
  ros__parameters:
    camera_mode: ""            # the sensor mode the frames come from (argus_camera modes.yaml); must be calibrated
    airframe: ""               # the airframe whose camera mount is used (argus_camera robot.yaml)
    image_topic: "camera/image"  # where a sim mode's frames come from; a real camera is read inside the node
    detector: "engine"         # "engine": the TensorRT engine at engine_path, run through Ultralytics on the Jetson; "oracle": the sim's stand-in
    engine_path: ""            # the engine file; empty: the node does not start on the engine detector
    engine_classes: ["marker"]   # what each of the engine's class numbers is on the detection contract (last year's engine has one class, the marker)
    start_enabled: false       # false: the pipeline waits for /loc/set_enabled (the survey mission starts and stops it)
    sim_only: false            # true only in the sim: the oracle detector refuses to run without it and sim time
    ground_below_home_m: 0.0   # how far the ground under the survey is below home, in metres (negative: above it); where boxes are put when the rangefinder is not believed
    oracle_objects_file: ""    # the run's list of true objects, written by the sim's scenario build
    oracle_seed: 0             # the oracle's noise repeats with its seed
    oracle_pixel_sigma_px: 2.0   # the oracle's pixel noise, in full-frame pixels
    oracle_miss_rate: 0.05       # the share of sightings the oracle leaves out
    oracle_false_alarms_per_frame: 0.02  # how many boxes of nothing the oracle adds to a frame, on average
    digit_model_path: ""         # the trained digit classifier's ONNX file; with none the digit reader does not start, and the node runs without it
    digit_min_confidence: 0.9    # the digit reader answers only when its best digit has at least this probability; written with a decimal point
    frame_log_dir: ""            # the folder the survey's frames are logged under (a new folder each survey); it must exist: outside the repo, on the NVMe
    frame_log_workers: 3         # threads that encode the JPEGs (the Orin Nano has no hardware encoder); 1 or more, a whole number
    frame_log_jpeg_quality: 90   # JPEG quality of the logged frames; a whole number
    frame_log_max_gb: 400.0      # one survey's log stops at this size; written with a decimal point
    frame_log_min_free_gb: 20.0  # the logging stops, or does not start, with less than this free on the disk; written with a decimal point
    features:
      loc_node: false              # Run the localisation pipeline: frames to /loc/detections and /loc/status (loc_node.py).
      sim_oracle_detector: false   # The sim's oracle detector: true object poses through the camera model. Sim only (oracle.py).
      loc_tiling: false            # Give the detector overlapping windows of the full frame instead of the shrunk frame (tiling.py).
      marker_tracker: false        # Track the markers on the ground and publish /loc/tracks (marker_tracker.py, LOC-7).
      loc_median_position: false   # A track's published position is the weighted median of its sightings, not the filter's (final_position.py, LOC-9). Needs marker_tracker.
      survey_frame_log: false      # Log every frame of the survey as JPEG under frame_log_dir, giving way to the detector (frame_logging.py, LOC-11).
      digit_reader: false          # Read the digit of every marker crop, or abstain (digit_reader.py, LOC-6).
      template_digit_classifier: false  # The digit reader's stand-in classifier for the sim's marker model; not a trained model. Needs digit_reader, sim time and sim_only.
